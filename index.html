  function loadState(){

      const raw=localStorage.getItem(STORAGE_KEY)||localStorage.getItem(LEGACY_STORAGE_KEY); if(!raw) return initialState();

  function migrate(s){
    const base=initialState();
    if(!s || typeof s!=='object') return base;
    s.version=2; s.users=s.users||base.users; s.shared=Object.assign(base.shared,s.shared||{}); s.settings=s.settings||{};

  }

  function cloudConfig(){try{return JSON.parse(localStorage.getItem(CLOUD_CONFIG_KEY)||'null')}catch(e){return null}}
  function cloudMeta(){try{return JSON.parse(localStorage.getItem(CLOUD_META_KEY)||'null')}catch(e){return null}}

  function setCloudStatus(status){cloud.status=status;if(status==='online')cloud.lastSync=new Date().toISOString();}
  function clone(x){return JSON.parse(JSON.stringify(x))}
  function mergeArrays(a=[],b=[]){const m=new Map();[...a,...b].forEach(x=>m.set(typeof x==='string'?x:JSON.stringify(x),x));return [...m.values()]}
  function mergeShared(a={},b={}){return {goals:mergeArrays(a.goals,b.goals),challenges:mergeArrays(a.challenges,b.challenges),speakingSeconds:Math.max(Number(a.speakingSeconds)||0,Number(b.speakingSeconds)||0),completedWeeks:mergeArrays(a.completedWeeks,b.completedWeeks),milestones:mergeArrays(a.milestones,b.milestones)}}

  function scheduleCloudSync(){if(!cloud.ready||cloud.hydrating||!cloud.groupId)return;clearTimeout(cloud.syncTimer);cloud.syncTimer=setTimeout(()=>syncToCloud(),700)}
  async function syncToCloud(){
    if(!cloud.ready||!cloud.client||!cloud.groupId)return;
    try{
      setCloudStatus('syncing');
      const mine=cloudSlotId();
      const {error}=await cloud.client.rpc('save_learning_progress',{p_user_state:clone(state.users[mine]),p_shared_state:clone(state.shared)});
      if(error)throw error;
      localOnlySave();setCloudStatus('online');
    }catch(err){console.warn('Cloud sync failed',err);setCloudStatus('offline');cloud.error=err?.message||String(err);localOnlySave();}
  }
  async function refreshCloudState(showToast=false){
    if(!cloud.client||!cloud.groupId)return;
    try{
      if(cloud.syncTimer){clearTimeout(cloud.syncTimer);cloud.syncTimer=null;await syncToCloud();}
      const {data,error}=await cloud.client.from('learning_groups').select('name,invite_code,app_state,updated_at').eq('id',cloud.groupId).single();if(error)throw error;
      const {data:members,error:memberError}=await cloud.client.from('group_members').select('user_id,slot').eq('group_id',cloud.groupId).order('slot');if(memberError)throw memberError;
      cloud.memberCount=(members||[]).length;const ids=(members||[]).map(m=>m.user_id);let profiles=[];
      if(ids.length){const pr=await cloud.client.from('profiles').select('id,display_name').in('id',ids);if(pr.error)throw pr.error;profiles=pr.data||[];}
      cloud.hydrating=true;
      let remote=migrate(data?.app_state&&Object.keys(data.app_state).length?data.app_state:initialState());
      (members||[]).forEach(m=>{const id=m.slot===2?'u2':'u1',pr=profiles.find(p=>p.id===m.user_id);if(pr?.display_name)remote.users[id].name=pr.display_name;});
      const mine=cloudSlotId();
      remote.activeUser=mine;state=remote;cloud.inviteCode=data.invite_code;cloud.groupName=data.name||'Parliamo';localOnlySave();saveCloudMeta();cloud.hydrating=false;setCloudStatus('online');
      if(showToast)toast('Lernstände aktualisiert.');
      render();
    }catch(err){console.warn('Cloud refresh failed',err);setCloudStatus('offline');cloud.error=err?.message||String(err);if(showToast)toast('Keine Verbindung – lokaler Stand bleibt erhalten.');render();}
  }
  async function loadMembership(){
    const {data,error}=await cloud.client.from('group_members').select('group_id,slot').eq('user_id',cloud.user.id).maybeSingle();if(error)throw error;
    if(!data)return false;cloud.groupId=data.group_id;cloud.slot=data.slot;saveCloudMeta();return true;

  async function upsertProfile(displayName){
    const name=(displayName||cloud.user?.user_metadata?.display_name||cloud.user?.email?.split('@')[0]||'Lernender').trim().slice(0,40);
    const {error}=await cloud.client.from('profiles').upsert({id:cloud.user.id,display_name:name},{onConflict:'id'});if(error)throw error;return name;

  async function boot(){
    const cfg=cloudConfig();
    if(!cfg?.url||!cfg?.key){renderCloudConfig();return;}
    try{
      if(!window.supabase?.createClient)throw new Error('Supabase-Bibliothek konnte nicht geladen werden. Prüfe die Internetverbindung.');
      cloud.client=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
      const {data,error}=await cloud.client.auth.getSession();if(error)throw error;cloud.session=data.session;cloud.user=data.session?.user||null;
      cloud.client.auth.onAuthStateChange((_event,session)=>{cloud.session=session;cloud.user=session?.user||null;if(!session){cloud.ready=false;cloud.groupId=null;clearInterval(cloud.pollTimer);renderAuth();}});
      if(!cloud.session){renderAuth();return;}
      await upsertProfile();
      const hasMembership=await loadMembership();
      if(!hasMembership){renderGroupSetup();return;}
      cloud.ready=true;await refreshCloudState();setupVoiceRealtime();
      clearInterval(cloud.pollTimer);cloud.pollTimer=setInterval(()=>{if(document.visibilityState==='visible')refreshCloudState(false)},30000);
    }catch(err){cloud.error=err?.message||String(err);const meta=cloudMeta();if(meta?.groupId){cloud.groupId=meta.groupId;cloud.slot=meta.slot||1;cloud.inviteCode=meta.inviteCode;cloud.groupName=meta.groupName||'Parliamo';cloud.ready=true;setCloudStatus('offline');render();}else renderCloudConfig(cloud.error);}
  }

  function nextChallengeStep(){const c=ui.challenge,item=WEEK_CHALLENGE.flow[c.step];const spent=item.min*60-c.remaining;c.elapsedTotal+=Math.max(0,spent);if(c.step===1||c.step===3)c.elapsedSpeak+=Math.max(0,spent);clearLessonTimer();if(c.step>=WEEK_CHALLENGE.flow.length-1){state.shared.challenges.push({ts:new Date().toISOString(),type:'week1',elapsed:c.elapsedTotal});state.shared.speakingSeconds+=c.elapsedSpeak;if(!state.shared.completedWeeks.includes(1))state.shared.completedWeeks.push(1);save();closeOverlay();confetti();toast('Woche-1-Challenge gespeichert. Bravissimi!');render();return;}c.step++;c.remaining=WEEK_CHALLENGE.flow[c.step].min*60;renderChallengeSession();}

  function targetErrors(){
    const e=topErrors(1)[0]; if(!e)return toast('Noch kein Fehlerprofil – zuerst ein paar Aufgaben lösen.'); const exs=Object.values(EXERCISES).filter(x=>x.error===e.key).slice(0,6);if(!exs.length)return startReview();ui.lesson={id:'w1l4',mode:'review',score:0,testTotal:0,testCorrect:0,helpUsed:0};ui.lessonStep=0;ui.lessonAnswers={};ui.hintLevel={};ui.lessonCards=exs.map(ex=>({kind:'exercise',ex}));ui.lessonCards.push({kind:'summary'});renderLesson();
  }

  function showSheet(html,center=false){$('#overlay').innerHTML=`<div class="modal-backdrop ${center?'modal-center':''}" data-action="sheet-backdrop"><div class="sheet"><div class="sheet-handle"></div>${html}</div></div>`;}
  function closeSheet(){if(ui.timer){clearLessonTimer();}$('#overlay').innerHTML='';}
  function accountSheet(){
    const p=otherUser();showSheet(`<div class="row between"><div><span class="eyebrow">Parliamo Cloud</span><h2 style="margin:4px 0">Konto & Lerngruppe</h2></div><button class="icon-btn" data-action="close-sheet"><i class="fa-solid fa-xmark"></i></button></div><div class="card" style="margin-top:14px"><div class="profile-hero"><div class="avatar">${initials(user().name)}</div><div class="grow"><b>${esc(user().name)}</b><div class="small muted">${esc(cloud.user?.email||'Angemeldet')}</div></div><span class="cloud-status ${cloud.status==='offline'?'offline':''}">${cloudStatusText()}</span></div></div><div class="card"><span class="eyebrow">Lerngruppe</span><h3 style="margin:5px 0">${esc(cloud.groupName||'Parliamo')}</h3><div class="invite-code" style="font-size:20px">${esc(cloud.inviteCode||'—')}</div><p class="small muted" style="margin:10px 0 0">Partner: ${esc(p?.name||'noch nicht beigetreten')}</p></div><button class="btn secondary wide" data-action="cloud-refresh"><i class="fa-solid fa-rotate"></i>Jetzt synchronisieren</button><button class="btn ghost wide" data-action="cloud-logout" style="margin-top:9px"><i class="fa-solid fa-arrow-right-from-bracket"></i>Abmelden</button>`);
  }
  function infoSheet(title,body){showSheet(`<div class="row between"><h2>${title}</h2><button class="icon-btn" data-action="close-sheet"><i class="fa-solid fa-xmark"></i></button></div><div class="sub" style="color:var(--text);line-height:1.55">${body}</div>`);}

  function exportData(){
    const payload={format:'parliamo-cloud-backup-v2',exportedAt:new Date().toISOString(),group:{name:cloud.groupName,inviteCode:cloud.inviteCode},learner:clone(user()),shared:clone(state.shared)};
    const data=JSON.stringify(payload,null,2),blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`parliamo-${normalize(user().name).replace(/\s+/g,'-')||'lernstand'}-${dateOnlyLocal()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Dein Lernstand wurde exportiert.');
  }
  function importData(){document.getElementById('importFile').click();}
  function askReset(){showSheet(`<span class="eyebrow">Sicherheitsabfrage</span><h2>Lernstand zurücksetzen?</h2><p class="sub">Dein persönlicher Lernstand, Wiederholungen und XP werden zurückgesetzt. Das Konto, die Lerngruppe und der Lernstand deines Partners bleiben erhalten. Exportiere vorher bei Bedarf deinen Lernstand.</p><div class="field"><label>Tippe ZURÜCKSETZEN</label><input id="resetConfirm" class="input" autocomplete="off" autocapitalize="characters"></div><button class="btn terra wide" data-action="reset-confirm">Endgültig zurücksetzen</button>`);}
  function confetti(){const c=document.createElement('div');c.className='confetti';c.innerHTML=Array.from({length:28},(_,i)=>`<i style="left:${(i*37)%100}%;animation-delay:${(i%7)*.06}s"></i>`).join('');document.body.appendChild(c);setTimeout(()=>c.remove(),1500);}

  function awaitMaybe(p){Promise.resolve(p).catch(err=>{console.error(err);cloud.error=err?.message||String(err);toast('Aktion fehlgeschlagen.');});}
  async function updateCloudDisplayName(name){if(!cloud.client||!cloud.user)return;try{await upsertProfile(name);await cloud.client.auth.updateUser({data:{display_name:name}});await refreshCloudState(false);}catch(err){console.warn(err)}}
  async function handleCloudLogin(){
    const email=$('#authEmail')?.value.trim()||'',password=$('#authPassword')?.value||'';if(!email||password.length<8){cloud.error='Bitte E-Mail und Passwort mit mindestens 8 Zeichen eingeben.';renderAuth();return;}
    cloud.error='';const {data,error}=await cloud.client.auth.signInWithPassword({email,password});if(error){cloud.error=error.message;renderAuth();return;}cloud.session=data.session;cloud.user=data.user;await upsertProfile();if(await loadMembership()){cloud.ready=true;await refreshCloudState();setupVoiceRealtime();clearInterval(cloud.pollTimer);cloud.pollTimer=setInterval(()=>{if(document.visibilityState==='visible')refreshCloudState(false)},30000);}else renderGroupSetup();
  }
  async function handleCloudRegister(){
    const name=$('#authName')?.value.trim()||'',email=$('#authEmail')?.value.trim()||'',password=$('#authPassword')?.value||'';if(name.length<1||!email||password.length<8){cloud.error='Bitte Name, gültige E-Mail und ein Passwort mit mindestens 8 Zeichen eingeben.';renderAuth();return;}
    cloud.error='';const redirectTo=location.origin+location.pathname;const {data,error}=await cloud.client.auth.signUp({email,password,options:{data:{display_name:name},emailRedirectTo:redirectTo}});if(error){cloud.error=error.message;renderAuth();return;}if(!data.session){cloud.authMode='login';renderAuth('Konto erstellt. Prüfe jetzt deine E-Mail und bestätige den Link. Danach kannst du dich anmelden.');return;}cloud.session=data.session;cloud.user=data.user;await upsertProfile(name);renderGroupSetup();
  }
  async function handleCreateGroup(){
    const displayName=$('#groupDisplayName')?.value.trim()||'',groupName=$('#groupName')?.value.trim()||'Parliamo zu zweit';if(!displayName){cloud.error='Bitte deinen Anzeigenamen eintragen.';renderGroupSetup();return;}
    cloud.error='';const {data,error}=await cloud.client.rpc('create_learning_group',{p_display_name:displayName,p_group_name:groupName});if(error){cloud.error=error.message;renderGroupSetup();return;}const row=Array.isArray(data)?data[0]:data;cloud.groupId=row.group_id;cloud.slot=row.slot||1;cloud.inviteCode=row.invite_code;cloud.groupName=groupName;cloud.ready=true;{const old=migrate(loadState()),saved=clone(old.users[old.activeUser]||newUser(displayName));state=initialState();state.activeUser=cloudSlotId();state.users[state.activeUser]=Object.assign(newUser(displayName),saved,{name:displayName});localOnlySave();}saveCloudMeta();await syncToCloud();await refreshCloudState();setupVoiceRealtime();
  }
  async function handleJoinGroup(){
    const displayName=$('#groupDisplayName')?.value.trim()||'',code=($('#inviteCode')?.value||'').trim().toUpperCase();if(!displayName||code.length<6){cloud.error='Bitte deinen Anzeigenamen und den Einladungscode eingeben.';renderGroupSetup();return;}
    cloud.error='';const {data,error}=await cloud.client.rpc('join_learning_group',{p_invite_code:code,p_display_name:displayName});if(error){cloud.error=error.message;renderGroupSetup();return;}const row=Array.isArray(data)?data[0]:data;cloud.groupId=row.group_id;cloud.slot=row.slot||2;cloud.inviteCode=row.invite_code;cloud.groupName=row.group_name||'Parliamo';cloud.ready=true;{const old=migrate(loadState()),saved=clone(old.users[old.activeUser]||newUser(displayName));state=initialState();state.activeUser=cloudSlotId();state.users[state.activeUser]=Object.assign(newUser(displayName),saved,{name:displayName});localOnlySave();}saveCloudMeta();await syncToCloud();await refreshCloudState();setupVoiceRealtime();
  }
  async function handleCloudLogout(){
    clearVoiceDraft();if(voice.currentAudio){voice.currentAudio.pause();voice.currentAudio=null;voice.currentId=null;}if(voice.channel&&cloud.client){try{await cloud.client.removeChannel(voice.channel)}catch(e){}voice.channel=null;}closeSheet();clearInterval(cloud.pollTimer);if(cloud.client)await cloud.client.auth.signOut();cloud.session=null;cloud.user=null;cloud.ready=false;cloud.groupId=null;localStorage.removeItem(CLOUD_META_KEY);renderAuth();
  }
  document.addEventListener('click',e=>{
    const nav=e.target.closest('.nav-btn'); if(nav){ui.tab=nav.dataset.tab;haptic();render();return;}
    const speakBtn=e.target.closest('[data-speak]');if(speakBtn){speak(speakBtn.dataset.speak);return;}
    const goal=e.target.closest('[data-goal]');if(goal){const g=goal.dataset.goal,i=state.shared.goals.indexOf(g);if(i>=0)state.shared.goals.splice(i,1);else state.shared.goals.push(g);save();renderOnboarding();return;}
    const diag=e.target.closest('[data-diag]');if(diag){const q=DIAG[ui.diagnosticIndex],ok=Number(diag.dataset.diag)===q.a;ui.diagnosticAnswers++;if(ok){ui.diagnosticScore++;const m=masteryFor(q.obj);m.correct++;m.level='Bekannt';m.lastReview=new Date().toISOString();m.nextReview=new Date(Date.now()+3*DAY).toISOString();}ui.diagnosticIndex++;if(ui.diagnosticIndex>=DIAG.length){user().diagnosticComplete=true;user().diagnosticScore=ui.diagnosticScore;updateStudyDay(3);save();ui.diagnosticIndex=0;ui.diagnosticScore=0;$('#bottomNav').classList.remove('hidden');toast('Startdiagnose gespeichert.');}render();return;}
    const knowledgeBtn=e.target.closest('[data-knowledge]');if(knowledgeBtn){openKnowledgeBase(knowledgeBtn.dataset.knowledge);return;}
    const lessonBtn=e.target.closest('[data-lesson]');if(lessonBtn){openLesson(lessonBtn.dataset.lesson);return;}
    const choice=e.target.closest('[data-choice]');if(choice&&ui.lesson){const ex=ui.lessonCards[ui.lessonStep].ex;ui.lessonAnswers[ex.id]=Object.assign(ui.lessonAnswers[ex.id]||{},{value:choice.dataset.choice,checked:false});renderLesson();return;}
    const add=e.target.closest('[data-sort-add]');if(add&&ui.lesson){const ex=ui.lessonCards[ui.lessonStep].ex,d=ui.lessonAnswers[ex.id],idx=Number(add.dataset.sortAdd),item=d.bank.find(x=>x.idx===idx);d.bank=d.bank.filter(x=>x.idx!==idx);d.selected.push(item);renderLesson();return;}
    const rem=e.target.closest('[data-sort-remove]');if(rem&&ui.lesson){const ex=ui.lessonCards[ui.lessonStep].ex,d=ui.lessonAnswers[ex.id],idx=Number(rem.dataset.sortRemove),item=d.selected.find(x=>x.idx===idx);d.selected=d.selected.filter(x=>x.idx!==idx);d.bank.push(item);d.bank.sort((a,b)=>a.idx-b.idx);renderLesson();return;}
    const ubtn=e.target.closest('[data-user]');if(ubtn){accountSheet();return;}
    const rating=e.target.closest('[data-speak-rating]');if(rating){addError(rating.dataset.speakRating==='schwierig'?'pronunciation':'careless',rating.dataset.speakRating==='schwierig'?1:0);closeSheet();nextLessonCard();return;}
    const act=e.target.closest('[data-action]')?.dataset.action;if(!act)return;
    if(act==='save-cloud-config'){
      const url=$('#cloudUrl')?.value.trim().replace(/\/$/,'')||'',key=$('#cloudKey')?.value.trim()||'';
      if(!/^https:\/\/.+\.supabase\.co$/i.test(url)||!key.startsWith('sb_publishable_')){cloud.error='Bitte eine gültige Supabase Project URL und einen Publishable Key (sb_publishable_…) eintragen.';renderCloudConfig(cloud.error);return;}
      localStorage.setItem(CLOUD_CONFIG_KEY,JSON.stringify({url,key}));cloud.error='';awaitMaybe(boot());return;
    }
    if(act==='edit-cloud-config'){localStorage.removeItem(CLOUD_CONFIG_KEY);cloud.client=null;cloud.session=null;cloud.user=null;cloud.ready=false;renderCloudConfig();return;}
    if(act==='auth-mode-login'){cloud.authMode='login';cloud.error='';renderAuth();return;}
    if(act==='auth-mode-register'){cloud.authMode='register';cloud.error='';renderAuth();return;}
    if(act==='cloud-login'){awaitMaybe(handleCloudLogin());return;}
    if(act==='cloud-register'){awaitMaybe(handleCloudRegister());return;}
    if(act==='group-mode-create'){cloud.groupMode='create';cloud.error='';renderGroupSetup();return;}
    if(act==='group-mode-join'){cloud.groupMode='join';cloud.error='';renderGroupSetup();return;}
    if(act==='create-group'){awaitMaybe(handleCreateGroup());return;}
    if(act==='join-group'){awaitMaybe(handleJoinGroup());return;}
    if(act==='cloud-refresh'){awaitMaybe((async()=>{closeSheet();await refreshCloudState(true)})());return;}
    if(act==='voice-record'){const b=e.target.closest('[data-action="voice-record"]');openVoiceRecorder(b?.dataset.lessonId||null);return;}
    if(act==='voice-refresh'){awaitMaybe(loadVoiceMessages(false));return;}
    if(act==='voice-start'){awaitMaybe(startVoiceRecording());return;}
    if(act==='voice-stop'){stopVoiceRecording();return;}
    if(act==='voice-discard'){clearVoiceDraft();renderVoiceRecorderSheet();return;}
    if(act==='voice-send'){awaitMaybe(sendVoiceMessage());return;}
    if(act==='voice-close'){clearVoiceDraft();closeSheet();return;}
    if(act==='voice-play'){const b=e.target.closest('[data-action="voice-play"]');awaitMaybe(playVoiceMessage(b?.dataset.voiceId,b));return;}
    if(act==='voice-delete'){const b=e.target.closest('[data-action="voice-delete"]');awaitMaybe(deleteVoiceMessage(b?.dataset.voiceId));return;}
    if(act==='cloud-logout'){awaitMaybe(handleCloudLogout());return;}
    if(act==='account-sheet'){accountSheet();return;}
    if(act==='onb-next'){ui.onboardStep=Math.min(4,ui.onboardStep+1);renderOnboarding();}
    else if(act==='save-names'){user().name=$('#name1').value.trim()||user().name||'Lernender';save();awaitMaybe(updateCloudDisplayName(user().name));ui.onboardStep=3;renderOnboarding();}
    else if(act==='finish-onb'){user().onboardingComplete=true;save();render();}
    else if(act==='diag-skip'){user().diagnosticComplete=true;user().diagnosticScore=0;save();$('#bottomNav').classList.remove('hidden');render();}
    else if(act==='switch-user')accountSheet();
    else if(act==='start-today'){const p=todayPlan();if(p.kind==='review')startReview();else if(p.kind==='challenge')openWeekChallenge();else openLesson(user().currentLesson);}
    else if(act==='start-review')startReview();
    else if(act==='quick-speak')openQuickSpeak();
    else if(act==='week-challenge')openWeekChallenge();
    else if(act==='challenge-start-dialog')startChallengeDialog();
    else if(act==='challenge-timer-toggle')toggleChallengeTimer();
    else if(act==='challenge-next')nextChallengeStep();
    else if(act==='path-info')infoSheet('Freischaltlogik','Neue Inhalte werden nicht nur durch XP freigeschaltet. Entscheidend sind abgeschlossene vorherige Lektionen, mindestens 80 % Wiederholungsquote, stabile essentielle Grammatik (mindestens 70 %) und bestandene Tests. Bei Schwächen gibt es gezielte Reparatur statt Rücksetzung.');
    else if(act==='practice-info')infoSheet('Wiederholen vor dem Vergessen','Grundintervalle: direkt in der Lektion, dann 1, 3, 7, 14, 30 und 60 Tage. Fehler verkürzen das Intervall. Sichere, hilfefreie Abrufe verlängern es. „Beherrscht“ braucht drei erfolgreiche Abrufe an verschiedenen Tagen und mindestens einen aktiven Deutsch→Italienisch-Abruf ohne Hilfe.');
    else if(act==='pronunciation')showPronunciation();
    else if(act==='weekly-test')openWeeklyTest();
    else if(act==='target-errors')targetErrors();
    else if(['quicktalk','roleplay','duel','infogap','60sec'].includes(act))showPartnerMode(act);
    else if(act==='close-sheet'){if(voice.recorder||voice.blob)clearVoiceDraft();closeSheet();}
    else if(act==='sheet-backdrop'&&e.target.classList.contains('modal-backdrop')){if(voice.recorder||voice.blob)clearVoiceDraft();closeSheet();}
    else if(act==='close-lesson'||act==='close-knowledge')closeOverlay();
    else if(act==='lesson-next')nextLessonCard();
    else if(act==='vocab-again')speak(ui.lessonCards[ui.lessonStep].v.ex);
    else if(act==='check-answer')checkCurrentAnswer();
    else if(act==='hint'){const ex=ui.lessonCards[ui.lessonStep].ex;if(ex.test)return toast('Mini-Tests laufen ohne Hilfe.');ui.hintLevel[ex.id]=Math.min(4,(ui.hintLevel[ex.id]||0)+1);ui.lesson.helpUsed++;renderLesson();}
    else if(act==='timer-toggle')toggleTimer();
    else if(act==='timer-finish')finishSpeaking();
    else if(act==='complete-lesson')completeLesson();
    else if(act==='finish-practice-session')finishPracticeSession();
    else if(act==='finish-weekly-test')finishWeeklyTest();
    else if(act==='repair-lesson')repairLesson();
    else if(act==='close-standalone')closeOverlay();
    else if(act==='stand-timer')toggleStandaloneTimer();
    else if(act==='stand-finish')finishStandalone(e.target.closest('[data-shared]')?.dataset.shared==='true');
    else if(act==='handover-next'){ui.handover.step++;if(ui.handover.step>5)partnerComplete();else renderHandover();}
    else if(act==='partner-five-timer'){ui.timerSeconds=300;ui.timerRunning=false;toggleStandaloneTimer();}
    else if(act==='partner-complete')partnerComplete();
    else if(act==='export')exportData();
    else if(act==='import')importData();
    else if(act==='reset')askReset();
    else if(act==='reset-confirm'){if(normalize($('#resetConfirm').value)==='zurucksetzen'){const slot=state.activeUser,name=user().name;state.users[slot]=newUser(name);state.users[slot].onboardingComplete=true;save();ui={tab:'today',onboardStep:1,lesson:null,lessonStep:0,lessonCards:[],lessonAnswers:{},hintLevel:{},timer:null,timerSeconds:0,timerRunning:false,partnerTimer:null,diagnosticIndex:0,diagnosticScore:0,diagnosticAnswers:0};closeSheet();toast('Dein Lernstand wurde zurückgesetzt.');render();}else toast('Bitte exakt „ZURÜCKSETZEN“ eingeben.');}
  });

  document.addEventListener('input',e=>{
    if(e.target.id==='freeAnswer'&&ui.lesson){const card=ui.lessonCards[ui.lessonStep];if(card.kind==='exercise'){const d=ui.lessonAnswers[card.ex.id]||{};d.value=e.target.value;ui.lessonAnswers[card.ex.id]=d;}}
  });
  document.getElementById('importFile').addEventListener('change',ev=>{
    const f=ev.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(x.format==='parliamo-cloud-backup-v2'&&x.learner){state.users[state.activeUser]=Object.assign(newUser(user().name),x.learner);state.users[state.activeUser].name=user().name;state.shared=mergeShared(state.shared,x.shared||{});}else if(x.users&&x.shared){const legacy=migrate(x);state.users[state.activeUser]=legacy.users[legacy.activeUser]||legacy.users.u1;state.users[state.activeUser].name=user().name;state.shared=mergeShared(state.shared,legacy.shared);}else throw new Error('invalid');save();toast('Dein Lernstand wurde importiert und synchronisiert.');render();}catch(e){toast('Diese Datei ist kein gültiger Parliamo-Lernstand.');}finally{ev.target.value='';}};r.readAsText(f);
  });
  document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('#freeAnswer')&&!ui.lessonAnswers[ui.lessonCards[ui.lessonStep]?.ex?.id]?.checked)checkCurrentAnswer();});
  window.addEventListener('beforeunload',save);
  if('speechSynthesis'in window){speechSynthesis.getVoices();window.speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();}
  window.addEventListener('focus',()=>{if(cloud.ready&&cloud.groupId){refreshCloudState(false);if(ui.tab==='together'||ui.lesson?.id||ui.knowledgeLessonId)loadVoiceMessages(true);}});
  boot();
})();
</script>
</body>
