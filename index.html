  function evaluate(ex,value){

    $('#overlay').innerHTML=`<div class="lesson-shell"><div class="lesson-wrap"><div class="lesson-header"><div class="lesson-header-row"><button class="icon-btn" data-action="close-standalone"><i class="fa-solid fa-xmark"></i></button><div class="grow"><b>Handy-Übergabe</b></div></div></div>${html}</div></div>`;
  }
  function partnerComplete(){state.shared.challenges.push({ts:new Date().toISOString(),type:ui.handover?.type||'partner'});save();closeOverlay();toast('Gemeinsame Übung gespeichert.');render();}

  function openWeekChallenge(){
    if(!bothWeek1Done())return toast('Für die gemeinsame Challenge brauchen beide die vier Wochenlektionen.');
    showSheet(`<span class="eyebrow">Woche 1 · Partner-Challenge</span><h2>${WEEK_CHALLENGE.title}</h2><p class="sub">Ziel: Der Erstkontakt soll ohne vorbereiteten Dialog funktionieren.</p><div class="list">${WEEK_CHALLENGE.flow.map((x,i)=>`<div class="list-item"><div class="li-icon">${i+1}</div><div class="grow"><b>${x.title}</b><div class="small muted">${x.desc}</div></div><span class="pill">${x.min} Min</span></div>`).join('')}</div><div class="notice" style="margin:14px 0"><b>Muss frei möglich sein:</b> ${WEEK_CHALLENGE.requirements.join(' · ')}</div><button class="btn primary wide" data-action="challenge-start-dialog">Challenge starten</button>`);
  }
  function startChallengeDialog(){closeSheet();ui.challenge={step:0,remaining:WEEK_CHALLENGE.flow[0].min*60,running:false,elapsedSpeak:0,elapsedTotal:0};renderChallengeSession();}
  function renderChallengeSession(){
    const c=ui.challenge,item=WEEK_CHALLENGE.flow[c.step],total=WEEK_CHALLENGE.flow.length;clearLessonTimer();ui.timerSeconds=c.remaining;ui.timerRunning=false;
    const extras=c.step===2?`<div class="choice-list" style="margin-top:12px"><button class="choice" data-speak="Buongiorno, mi chiamo Giulia. Sono di Roma e sto bene."><i class="fa-solid fa-volume-high"></i> Hörsatz 1 abspielen</button><button class="choice" data-speak="Ciao! Sono Marco. Abito a Berlino. E tu?"><i class="fa-solid fa-volume-high"></i> Hörsatz 2 abspielen</button><div class="example"><b>Mini-Dialog</b><br>A: Ciao! Come ti chiami?<br>B: Mi chiamo Sara. E tu?<br>A: Sono Paolo. Di dove sei?<br>B: Sono di Firenze.</div></div>`:c.step===4?`<div class="notice terraBg" style="margin-top:12px"><b>Ohne Hilfe, abwechselnd:</b><br>1. Übersetze „Guten Morgen!“<br>2. Frage „Woher kommst du?“<br>3. Antworte auf „Come stai?“ mit Rückfrage.<br>4. Sage Name + Herkunft in einem Satz.<br><br>Ziel: mindestens 80 % korrekt. Wenn ihr unsicher seid, startet danach im Bereich Üben den Wochen-Test.</div>`:`<div class="hero-meta">${['Ciao!','Mi chiamo …','Di dove sei?','Dove abiti?','Come stai?','E tu?'].map(x=>`<span class="pill">${x}</span>`).join('')}</div>`;
    $('#overlay').innerHTML=`<div class="lesson-shell"><div class="lesson-wrap"><div class="lesson-header"><div class="lesson-header-row"><button class="icon-btn" data-action="close-standalone"><i class="fa-solid fa-xmark"></i></button><div class="progress"><i style="width:${Math.round(c.step/total*100)}%"></i></div><span class="small strong">${c.step+1}/${total}</span></div><div class="lesson-title">Woche 1 · ${WEEK_CHALLENGE.title}</div></div><div class="stage-label">${item.min} Minuten</div><div class="card learning-card"><span class="eyebrow">${item.title}</span><h2 style="margin-top:8px">${item.desc}</h2><div class="timer-ring"><div id="challengeTimer" class="timer">${formatTime(c.remaining)}</div></div>${extras}<div class="lesson-actions"><button class="btn secondary" data-action="challenge-timer-toggle"><i class="fa-solid fa-play"></i>Timer</button><button class="btn primary" data-action="challenge-next">${c.step===total-1?'Challenge abschließen':'Schritt erledigt'}</button></div></div></div></div>`;
  }
  function toggleChallengeTimer(){const c=ui.challenge,btn=$('[data-action="challenge-timer-toggle"]');if(ui.timerRunning){clearInterval(ui.timer);ui.timer=null;ui.timerRunning=false;c.remaining=ui.timerSeconds;if(btn)btn.innerHTML='<i class="fa-solid fa-play"></i>Weiter';return;}ui.timerRunning=true;if(btn)btn.innerHTML='<i class="fa-solid fa-pause"></i>Pause';ui.timer=setInterval(()=>{ui.timerSeconds--;c.remaining=ui.timerSeconds;const el=$('#challengeTimer');if(el)el.textContent=formatTime(ui.timerSeconds);if(ui.timerSeconds<=0){clearLessonTimer();c.remaining=0;haptic(35);toast('Abschnittszeit erreicht.');}},1000);}
  function nextChallengeStep(){const c=ui.challenge,item=WEEK_CHALLENGE.flow[c.step];const spent=item.min*60-c.remaining;c.elapsedTotal+=Math.max(0,spent);if(c.step===1||c.step===3)c.elapsedSpeak+=Math.max(0,spent);clearLessonTimer();if(c.step>=WEEK_CHALLENGE.flow.length-1){state.shared.challenges.push({ts:new Date().toISOString(),type:'week1',elapsed:c.elapsedTotal});state.shared.speakingSeconds+=c.elapsedSpeak;if(!state.shared.completedWeeks.includes(1))state.shared.completedWeeks.push(1);save();closeOverlay();confetti();toast('Woche-1-Challenge gespeichert. Bravissimi!');render();return;}c.step++;c.remaining=WEEK_CHALLENGE.flow[c.step].min*60;renderChallengeSession();}

  function targetErrors(){
    const e=topErrors(1)[0]; if(!e)return toast('Noch kein Fehlerprofil – zuerst ein paar Aufgaben lösen.'); const exs=Object.values(EXERCISES).filter(x=>x.error===e.key).slice(0,6);if(!exs.length)return startReview();ui.lesson={id:'w1l4',mode:'review',score:0,testTotal:0,testCorrect:0,helpUsed:0};ui.lessonStep=0;ui.lessonAnswers={};ui.hintLevel={};ui.lessonCards=exs.map(ex=>({kind:'exercise',ex}));ui.lessonCards.push({kind:'summary'});renderLesson();
  }

  function showSheet(html,center=false){$('#overlay').innerHTML=`<div class="modal-backdrop ${center?'modal-center':''}" data-action="sheet-backdrop"><div class="sheet"><div class="sheet-handle"></div>${html}</div></div>`;}
  function closeSheet(){if(ui.timer){clearLessonTimer();}$('#overlay').innerHTML='';}
  function switchUserSheet(){
    showSheet(`<div class="row between"><div><span class="eyebrow">Aktives Profil</span><h2 style="margin:4px 0">Wer lernt gerade?</h2></div><button class="icon-btn" data-action="close-sheet"><i class="fa-solid fa-xmark"></i></button></div><div class="choice-list" style="margin-top:15px">${Object.entries(state.users).map(([id,u])=>`<button class="choice ${state.activeUser===id?'selected':''}" data-user="${id}"><div class="row"><div class="avatar">${initials(u.name)}</div><div style="text-align:left"><b>${esc(u.name)}</b><div class="small muted">${levelForWeek(u.week)} · ${u.xp} XP</div></div></div></button>`).join('')}</div>`);
  }
  function infoSheet(title,body){showSheet(`<div class="row between"><h2>${title}</h2><button class="icon-btn" data-action="close-sheet"><i class="fa-solid fa-xmark"></i></button></div><div class="sub" style="color:var(--text);line-height:1.55">${body}</div>`);}

  function exportData(){
    const data=JSON.stringify(state,null,2),blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`parliamo-lernstand-${dateOnlyLocal()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Lernstand exportiert.');
  }
  function importData(){document.getElementById('importFile').click();}
  function askReset(){showSheet(`<span class="eyebrow">Sicherheitsabfrage</span><h2>Lernstand zurücksetzen?</h2><p class="sub">Alle Profile, Wiederholungen, XP und gemeinsamen Daten werden gelöscht. Exportiere vorher bei Bedarf deinen Lernstand.</p><div class="field"><label>Tippe ZURÜCKSETZEN</label><input id="resetConfirm" class="input" autocomplete="off" autocapitalize="characters"></div><button class="btn terra wide" data-action="reset-confirm">Endgültig zurücksetzen</button>`);}
  function confetti(){const c=document.createElement('div');c.className='confetti';c.innerHTML=Array.from({length:28},(_,i)=>`<i style="left:${(i*37)%100}%;animation-delay:${(i%7)*.06}s"></i>`).join('');document.body.appendChild(c);setTimeout(()=>c.remove(),1500);}

  document.addEventListener('click',e=>{
    const nav=e.target.closest('.nav-btn'); if(nav){ui.tab=nav.dataset.tab;haptic();render();return;}
    const speakBtn=e.target.closest('[data-speak]');if(speakBtn){speak(speakBtn.dataset.speak);return;}
    const goal=e.target.closest('[data-goal]');if(goal){const g=goal.dataset.goal,i=state.shared.goals.indexOf(g);if(i>=0)state.shared.goals.splice(i,1);else state.shared.goals.push(g);save();renderOnboarding();return;}
    const diag=e.target.closest('[data-diag]');if(diag){const q=DIAG[ui.diagnosticIndex],ok=Number(diag.dataset.diag)===q.a;ui.diagnosticAnswers++;if(ok){ui.diagnosticScore++;const m=masteryFor(q.obj);m.correct++;m.level='Bekannt';m.lastReview=new Date().toISOString();m.nextReview=new Date(Date.now()+3*DAY).toISOString();}ui.diagnosticIndex++;if(ui.diagnosticIndex>=DIAG.length){user().diagnosticComplete=true;user().diagnosticScore=ui.diagnosticScore;updateStudyDay(3);save();ui.diagnosticIndex=0;ui.diagnosticScore=0;$('#bottomNav').classList.remove('hidden');toast('Startdiagnose gespeichert.');}render();return;}
    const lessonBtn=e.target.closest('[data-lesson]');if(lessonBtn){openLesson(lessonBtn.dataset.lesson);return;}
    const choice=e.target.closest('[data-choice]');if(choice&&ui.lesson){const ex=ui.lessonCards[ui.lessonStep].ex;ui.lessonAnswers[ex.id]=Object.assign(ui.lessonAnswers[ex.id]||{},{value:choice.dataset.choice,checked:false});renderLesson();return;}
    const add=e.target.closest('[data-sort-add]');if(add&&ui.lesson){const ex=ui.lessonCards[ui.lessonStep].ex,d=ui.lessonAnswers[ex.id],idx=Number(add.dataset.sortAdd),item=d.bank.find(x=>x.idx===idx);d.bank=d.bank.filter(x=>x.idx!==idx);d.selected.push(item);renderLesson();return;}
    const rem=e.target.closest('[data-sort-remove]');if(rem&&ui.lesson){const ex=ui.lessonCards[ui.lessonStep].ex,d=ui.lessonAnswers[ex.id],idx=Number(rem.dataset.sortRemove),item=d.selected.find(x=>x.idx===idx);d.selected=d.selected.filter(x=>x.idx!==idx);d.bank.push(item);d.bank.sort((a,b)=>a.idx-b.idx);renderLesson();return;}
    const ubtn=e.target.closest('[data-user]');if(ubtn){state.activeUser=ubtn.dataset.user;save();closeSheet();render();return;}
    const rating=e.target.closest('[data-speak-rating]');if(rating){addError(rating.dataset.speakRating==='schwierig'?'pronunciation':'careless',rating.dataset.speakRating==='schwierig'?1:0);closeSheet();nextLessonCard();return;}
    const act=e.target.closest('[data-action]')?.dataset.action;if(!act)return;
    if(act==='onb-next'){ui.onboardStep=Math.min(4,ui.onboardStep+1);renderOnboarding();}
    else if(act==='save-names'){state.users.u1.name=$('#name1').value.trim()||'Torben';state.users.u2.name=$('#name2').value.trim()||'Freund';save();ui.onboardStep=3;renderOnboarding();}
    else if(act==='finish-onb'){state.onboardingComplete=true;save();render();}
    else if(act==='diag-skip'){user().diagnosticComplete=true;user().diagnosticScore=0;save();$('#bottomNav').classList.remove('hidden');render();}
    else if(act==='switch-user')switchUserSheet();
    else if(act==='start-today'){const p=todayPlan();if(p.kind==='review')startReview();else if(p.kind==='challenge')openWeekChallenge();else openLesson(user().currentLesson);}
    else if(act==='start-review')startReview();
    else if(act==='quick-speak')openQuickSpeak();
    else if(act==='week-challenge')openWeekChallenge();
    else if(act==='challenge-start-dialog')startChallengeDialog();
    else if(act==='challenge-timer-toggle')toggleChallengeTimer();
    else if(act==='challenge-next')nextChallengeStep();
    else if(act==='path-info')infoSheet('Freischaltlogik','Neue Inhalte werden nicht nur durch XP freigeschaltet. Entscheidend sind abgeschlossene vorherige Lektionen, mindestens 80 % Wiederholungsquote, stabile essentielle Grammatik (mindestens 70 %) und bestandene Tests. Bei Schwächen gibt es gezielte Reparatur statt Rücksetzung.');
    else if(act==='practice-info')infoSheet('Wiederholen vor dem Vergessen','Grundintervalle: direkt in der Lektion, dann 1, 3, 7, 14, 30 und 60 Tage. Fehler verkürzen das Intervall. Sichere, hilfefreie Abrufe verlängern es. „Beherrscht“ braucht drei erfolgreiche Abrufe an verschiedenen Tagen und mindestens einen aktiven Deutsch→Italienisch-Abruf ohne Hilfe.');
    else if(act==='pronunciation')showPronunciation();
    else if(act==='weekly-test')openWeeklyTest();
    else if(act==='target-errors')targetErrors();
    else if(['quicktalk','roleplay','duel','infogap','60sec'].includes(act))showPartnerMode(act);
    else if(act==='close-sheet')closeSheet();
    else if(act==='sheet-backdrop'&&e.target.classList.contains('modal-backdrop'))closeSheet();
    else if(act==='close-lesson')closeOverlay();
    else if(act==='lesson-next')nextLessonCard();
    else if(act==='vocab-again')speak(ui.lessonCards[ui.lessonStep].v.ex);
    else if(act==='check-answer')checkCurrentAnswer();
    else if(act==='hint'){const ex=ui.lessonCards[ui.lessonStep].ex;if(ex.test)return toast('Mini-Tests laufen ohne Hilfe.');ui.hintLevel[ex.id]=Math.min(4,(ui.hintLevel[ex.id]||0)+1);ui.lesson.helpUsed++;renderLesson();}
    else if(act==='timer-toggle')toggleTimer();
    else if(act==='timer-finish')finishSpeaking();
    else if(act==='complete-lesson')completeLesson();
    else if(act==='finish-practice-session')finishPracticeSession();
    else if(act==='finish-weekly-test')finishWeeklyTest();
    else if(act==='repair-lesson')repairLesson();
    else if(act==='close-standalone')closeOverlay();
    else if(act==='stand-timer')toggleStandaloneTimer();
    else if(act==='stand-finish')finishStandalone(e.target.closest('[data-shared]')?.dataset.shared==='true');
    else if(act==='handover-next'){ui.handover.step++;if(ui.handover.step>5)partnerComplete();else renderHandover();}
    else if(act==='partner-five-timer'){ui.timerSeconds=300;ui.timerRunning=false;toggleStandaloneTimer();}
    else if(act==='partner-complete')partnerComplete();
    else if(act==='export')exportData();
    else if(act==='import')importData();
    else if(act==='reset')askReset();
    else if(act==='reset-confirm'){if(normalize($('#resetConfirm').value)==='zurucksetzen'){localStorage.removeItem(STORAGE_KEY);state=initialState();ui={tab:'today',onboardStep:1,lesson:null,lessonStep:0,lessonCards:[],lessonAnswers:{},hintLevel:{},timer:null,timerSeconds:0,timerRunning:false,partnerTimer:null,diagnosticIndex:0,diagnosticScore:0,diagnosticAnswers:0};closeSheet();render();}else toast('Bitte exakt „ZURÜCKSETZEN“ eingeben.');}
  });

  document.addEventListener('input',e=>{
    if(e.target.id==='freeAnswer'&&ui.lesson){const card=ui.lessonCards[ui.lessonStep];if(card.kind==='exercise'){const d=ui.lessonAnswers[card.ex.id]||{};d.value=e.target.value;ui.lessonAnswers[card.ex.id]=d;}}
  });
  document.getElementById('importFile').addEventListener('change',ev=>{
    const f=ev.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.users||!x.shared)throw new Error('invalid');state=migrate(x);save();toast('Lernstand importiert.');render();}catch(e){toast('Diese Datei ist kein gültiger Parliamo-Lernstand.');}finally{ev.target.value='';}};r.readAsText(f);
  });
  document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('#freeAnswer')&&!ui.lessonAnswers[ui.lessonCards[ui.lessonStep]?.ex?.id]?.checked)checkCurrentAnswer();});
  window.addEventListener('beforeunload',save);
  if('speechSynthesis'in window){speechSynthesis.getVoices();window.speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();}
  render();
})();
</script>
</body>
</html>
